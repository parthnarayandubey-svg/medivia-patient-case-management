<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Patient - MEDIVIA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header and Navigation Bar -->
    <header>
        <nav>
            <a href="index.html" class="logo">MEDIVIA</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html" class="active">Register Patient</a></li>
                <li><a href="patients.html">View Patients</a></li>
                <li><a href="case.html">Case Taking</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Container -->
    <main class="container">
        
        <div class="card">
            <h2>Patient Registration</h2>
            <p style="margin-bottom: 15px; color: #555555;">Fill in the form below to register a new patient. Patient ID is auto-generated.</p>

            <form id="patientForm">
                <fieldset>
                    <legend>Patient Information</legend>

                    <div class="form-group">
                        <label for="patientId">Patient ID (Auto-Generated):</label>
                        <input type="text" id="patientId" name="patientId" readonly>
                    </div>

                    <div class="form-group">
                        <label for="patientName">Patient Name *</label>
                        <input type="text" id="patientName" name="patientName" placeholder="Enter patient full name" required>
                    </div>

                    <div class="form-group">
                        <label for="patientAge">Age *</label>
                        <input type="number" id="patientAge" name="patientAge" placeholder="Enter age" min="1" max="120" required>
                    </div>

                    <div class="form-group">
                        <label for="patientGender">Gender *</label>
                        <select id="patientGender" name="patientGender" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="patientPhone">Phone Number *</label>
                        <input type="tel" id="patientPhone" name="patientPhone" placeholder="Enter 10-digit phone number" required>
                    </div>

                    <div class="form-group">
                        <label for="patientSymptoms">Symptoms *</label>
                        <textarea id="patientSymptoms" name="patientSymptoms" rows="4" placeholder="Enter symptoms described by patient" required></textarea>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="btn btn-blue">Save</button>
                        <button type="button" id="resetBtn" class="btn btn-grey">Reset</button>
                    </div>

                </fieldset>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 MEDIVIA - Patient Case Taking Software | 1st Year B.Tech CSE326 Project</p>
    </footer>

    <!-- JavaScript File -->
    <script src="js/register.js"></script>
</body>
</html>
